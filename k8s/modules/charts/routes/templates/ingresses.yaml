{{- if or (eq .Values.controller "nginx") (eq .Values.controller "f5-nginx") }}
{{- $className := "nginx" -}}
{{- if eq .Values.controller "f5-nginx" -}}
{{- $className = "f5-nginx" -}}
{{- end -}}
{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-{{ .Values.controller }}
  namespace: {{ .Values.appNamespace }}
spec:
  ingressClassName: {{ $className }}
  {{ if .Values.tlsEnabled }}
  tls:
    - hosts:
        - {{ .Values.hostnames.frontend | quote }}
      secretName: frontend-wildcard-tls
  {{ end }}
  rules:
    - host: {{ .Values.hostnames.frontend | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
{{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-{{ .Values.controller }}
  namespace: monitoring
spec:
  ingressClassName: {{ $className }}
  {{ if .Values.tlsEnabled }}
  tls:
    - hosts:
        - {{ .Values.hostnames.grafana | quote }}
        - {{ .Values.hostnames.prometheus | quote }}
      secretName: monitoring-wildcard-tls
        {{ end }}
  rules:
    - host: {{ .Values.hostnames.grafana | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
    - host: {{ .Values.hostnames.prometheus | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
{{- end }}
{{- if .Values.logging.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-{{ .Values.controller }}
  namespace: logging
spec:
  ingressClassName: {{ $className }}
  {{- if .Values.tlsEnabled }}
  tls:
    - hosts:
        - {{ .Values.logging.kibanaHostname | quote }}
      secretName: logging-kibana-tls
  {{- end }}
  rules:
    - host: {{ .Values.logging.kibanaHostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.logging.kibanaService }}
                port:
                  number: 5601
{{- end }}
{{- else if eq .Values.controller "alb" }}
{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-{{ .Values.controller }}
  namespace: {{ .Values.appNamespace }}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ .Values.alb.groupName | quote }}
    alb.ingress.kubernetes.io/scheme: {{ .Values.alb.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.alb.certificateArn | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.hostnames.frontend | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
{{- end }}
