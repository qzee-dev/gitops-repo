{{- if eq .Values.controller "envoy" }}
{{- $sectionName := "http" -}}
{{- if .Values.tlsEnabled -}}
{{- $sectionName = "https" -}}
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-{{ .Values.controller }}
  namespace: {{ .Values.appNamespace }}
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: {{ $sectionName }}
  hostnames:
    - {{ .Values.hostnames.frontend | quote }}
  rules:
    - backendRefs:
        - name: frontend
          port: 80
{{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-{{ .Values.controller }}
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: {{ $sectionName }}
  hostnames:
    - {{ .Values.hostnames.grafana | quote }}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
{{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-{{ .Values.controller }}
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: {{ $sectionName }}
  hostnames:
    - {{ .Values.hostnames.prometheus | quote }}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
{{- end }}
{{- if .Values.logging.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana-{{ .Values.controller }}
  namespace: logging
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: {{ $sectionName }}
  hostnames:
    - {{ .Values.logging.kibanaHostname | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.logging.kibanaService }}
          port: 5601
{{- end }}
{{- if and .Values.tlsEnabled .Values.frontend.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-http-redirect-{{ .Values.controller }}
  namespace: {{ .Values.appNamespace }}
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: http
  hostnames:
    - {{ .Values.hostnames.frontend | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- if and .Values.tlsEnabled .Values.monitoring.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring-http-redirect-{{ .Values.controller }}
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: http
  hostnames:
    - {{ .Values.hostnames.grafana | quote }}
    - {{ .Values.hostnames.prometheus | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- if and .Values.tlsEnabled .Values.logging.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana-http-redirect-{{ .Values.controller }}
  namespace: logging
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: http
  hostnames:
    - {{ .Values.logging.kibanaHostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
