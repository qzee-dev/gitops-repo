controller: envoy
environment: dev
appNamespace: dev
domainSuffix: example.invalid
tlsEnabled: true
hostnames:
  frontend: app.example.invalid
  grafana: grafana.example.invalid
  prometheus: prometheus.example.invalid
frontend:
  enabled: true
monitoring:
  enabled: true
logging:
  enabled: false
  kibanaHostname: kibana.example.invalid
  kibanaService: kibana-kb-http
issuer:
  create: true
  name: letsencrypt-dns01
  server: https://acme-staging-v02.api.letsencrypt.org/directory
  email: operations@example.invalid
  region: us-east-1
  hostedZoneID: ""
alb:
  certificateArn: ""
  scheme: internal
  groupName: dev-sample-endpoints
