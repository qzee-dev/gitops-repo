apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: logging
spec:
  version: {{ .Values.elasticsearch.version | quote }}
  nodeSets:
    - name: default
      count: {{ .Values.elasticsearch.nodeCount }}
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: {{ .Values.elasticsearch.cpu | quote }}
                  memory: {{ .Values.elasticsearch.memory | quote }}
                limits:
                  cpu: {{ .Values.elasticsearch.cpu | quote }}
                  memory: {{ .Values.elasticsearch.memory | quote }}
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: {{ .Values.elasticsearch.storageSize | quote }}
            {{- if .Values.elasticsearch.storageClass }}
            storageClassName: {{ .Values.elasticsearch.storageClass | quote }}
            {{- end }}
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: {{ .Values.kibana.version | quote }}
  count: 1
  elasticsearchRef:
    name: elasticsearch
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: {{ .Values.kibana.cpu | quote }}
              memory: {{ .Values.kibana.memory | quote }}
            limits:
              cpu: {{ .Values.kibana.cpu | quote }}
              memory: {{ .Values.kibana.memory | quote }}
