{{- if eq .Values.controller "envoy" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-{{ .Values.controller }}
  namespace: {{ .Values.appNamespace }}
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: https
  hostnames:
    - {{ .Values.hostnames.frontend | quote }}
  rules:
    - backendRefs:
        - name: frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-{{ .Values.controller }}
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: https
  hostnames:
    - {{ .Values.hostnames.grafana | quote }}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-{{ .Values.controller }}
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: https
  hostnames:
    - {{ .Values.hostnames.prometheus | quote }}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-http-redirect-{{ .Values.controller }}
  namespace: {{ .Values.appNamespace }}
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: http
  hostnames:
    - {{ .Values.hostnames.frontend | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring-http-redirect-{{ .Values.controller }}
  namespace: monitoring
spec:
  parentRefs:
    - name: edge
      namespace: edge-gateway
      sectionName: http
  hostnames:
    - {{ .Values.hostnames.grafana | quote }}
    - {{ .Values.hostnames.prometheus | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
